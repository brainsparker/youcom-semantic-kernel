name: Test

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e . pytest pytest-asyncio ruff mypy

      - name: Lint
        if: matrix.python-version == '3.13' && runner.os == 'Linux'
        run: ruff check src tests samples && ruff format --check src tests samples && mypy -p youcom_semantic_kernel

      - name: Unit tests
        run: pytest -m "not integration" tests

      - name: Integration tests (keyless)
        if: runner.os == 'Linux'
        run: pytest -m integration tests
        env:
          YDC_API_KEY: ${{ secrets.YDC_API_KEY }}
