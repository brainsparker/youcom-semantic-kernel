[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "youcom-semantic-kernel"
version = "0.1.0"
description = "You.com web search connector for Semantic Kernel — works with zero configuration via the keyless free tier"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
keywords = ["Semantic Kernel", "Microsoft Agent Framework", "You.com", "Web Search", "AI Search", "TextSearch"]
authors = [{ name = "You.com", email = "developers@you.com" }]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "semantic-kernel>=1.30.0",
  "httpx>=0.27.0",
  "pydantic>=2.0.0",
  "typing-extensions>=4.5.0; python_version < '3.12'",
]

[project.optional-dependencies]
agent-framework = ["agent-framework-core>=1.0.0; python_version >= '3.11'"]

[project.urls]
Documentation = "https://github.com/youdotcom-oss/youcom-semantic-kernel#readme"
Issues = "https://github.com/youdotcom-oss/youcom-semantic-kernel/issues"
Source = "https://github.com/youdotcom-oss/youcom-semantic-kernel"

[tool.hatch.build.targets.wheel]
packages = ["src/youcom_semantic_kernel"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["A", "ANN", "ARG", "B", "C", "DTZ", "E", "EM", "F", "I", "ICN", "ISC", "N", "PLC", "PLE", "PLR", "PLW", "Q", "RUF", "S", "T", "TID", "UP", "W", "YTT"]
ignore = ["B008", "C901", "EM101", "EM102", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "ANN401", "S105", "S106", "S107"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["PLR2004", "S101", "TID252", "D", "ANN", "ARG001", "ARG002"]
"samples/**/*" = ["T201", "ANN"]

[tool.mypy]
check_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = "agent_framework.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--strict-markers"
markers = ["integration: integration tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
